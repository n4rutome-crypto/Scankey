<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriSnap</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f7f5; color: #1c2b1f; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  .cam { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 3/4; }
  video, #preview { width: 100%; height: 100%; object-fit: cover; display: block; }
  #preview { display: none; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  button, label.btn { flex: 1; padding: 14px; border: 0; border-radius: 12px; font-size: 16px;
    background: #2e7d32; color: #fff; text-align: center; cursor: pointer; }
  button.alt, label.btn { background: #dfe8df; color: #1c2b1f; }
  button:disabled { opacity: .5; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-top: 12px; box-shadow: 0 1px 3px #0001; }
  .big { font-size: 40px; font-weight: 700; }
  .macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; text-align: center; }
  .macros div { background: #eef4ee; border-radius: 10px; padding: 8px; font-size: 13px; }
  .macros b { display: block; font-size: 18px; }
  .item { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #eee; font-size: 14px; }
  .muted { color: #6b7a6d; font-size: 13px; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1>🥗 NutriSnap</h1>

  <div class="cam">
    <video id="video" autoplay playsinline muted></video>
    <img id="preview" alt="Foto makanan">
  </div>
  <canvas id="canvas" hidden></canvas>

  <div class="row">
    <button id="snap">📷 Foto</button>
    <button id="retake" class="alt" hidden>Ulangi</button>
    <label class="btn">Galeri<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  </div>

  <div id="out"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), preview = $("preview"), out = $("out");
let busy = false;

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false,
    });
    video.srcObject = stream;
  } catch (e) {
    out.innerHTML = `<div class="card muted">Kamera tidak bisa diakses (butuh HTTPS atau localhost). Gunakan tombol Galeri untuk ambil foto.</div>`;
  }
}

function drawToCanvas(source, w, h) {
  const max = 1024, scale = Math.min(1, max / Math.max(w, h));
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85);
}

async function analyze(dataUrl) {
  if (busy) return;
  busy = true;
  preview.src = dataUrl;
  preview.style.display = "block"; video.style.display = "none";
  $("retake").hidden = false;
  out.innerHTML = `<div class="card muted">Menganalisis makanan…</div>`;
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: dataUrl.split(",")[1], mediaType: "image/jpeg" }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    render(data);
  } catch (e) {
    out.innerHTML = `<div class="card err">Gagal: ${e.message}</div>`;
  } finally { busy = false; }
}

function render(d) {
  if (!d.is_food) { out.innerHTML = `<div class="card">Tidak terdeteksi makanan di foto ini.</div>`; return; }
  const t = d.total;
  out.innerHTML = `
    <div class="card">
      <div class="muted">Total perkiraan</div>
      <div class="big">${Math.round(t.kalori)} <span style="font-size:16px">kkal</span></div>
      <div class="macros">
        <div><b>${t.protein_g}g</b>Protein</div>
        <div><b>${t.karbo_g}g</b>Karbo</div>
        <div><b>${t.lemak_g}g</b>Lemak</div>
        <div><b>${t.serat_g}g</b>Serat</div>
        <div><b>${t.gula_g}g</b>Gula</div>
        <div><b>${t.natrium_mg}mg</b>Natrium</div>
      </div>
      ${d.items.map(i => `<div class="item"><span>${i.nama} <span class="muted">(${i.porsi_gram}g)</span></span><b>${Math.round(i.kalori)} kkal</b></div>`).join("")}
      <p class="muted">Keyakinan: ${d.keyakinan}. ${d.catatan || ""}</p>
      <p class="muted">Ini hanya perkiraan, bukan saran medis.</p>
    </div>`;
}

$("snap").onclick = () => {
  if (!video.videoWidth) return $("file").click();
  analyze(drawToCanvas(video, video.videoWidth, video.videoHeight));
};

$("file").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => analyze(drawToCanvas(img, img.width, img.height));
  img.src = URL.createObjectURL(f);
};

$("retake").onclick = () => {
  preview.style.display = "none"; video.style.display = "block";
  $("retake").hidden = true; out.innerHTML = ""; $("file").value = "";
};

startCamera();
</script>
</body>
</html>
